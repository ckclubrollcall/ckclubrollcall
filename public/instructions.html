<html lang="zh-Hant"><head><meta charset="utf-8">

<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--mu:#6c6c70;--sep:rgba(60,60,67,.18);--ac:#007aff;--glass:rgba(249,249,249,.72);--bk:#000;--bt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:#98989f;--sep:rgba(84,84,88,.55);--ac:#0a84ff;--glass:rgba(30,30,30,.72);--bk:#fff;--bt:#000}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:#98989f;--sep:rgba(84,84,88,.55);--ac:#0a84ff;--glass:rgba(30,30,30,.72);--bk:#fff;--bt:#000}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);text-align:center;font-weight:600;padding:13px 16px;font-size:17px}
.w{max-width:680px;margin:0 auto;padding:8px 16px 40px}
h1{font-size:34px;line-height:1.15;letter-spacing:-.02em;margin:22px 4px 6px}
.lead{color:var(--mu);margin:0 4px 6px;font-size:15px}
.sec{font-size:13px;text-transform:none;color:var(--mu);margin:28px 16px 8px}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--tx);text-decoration:none;min-height:56px}
.row+.row{border-top:.5px solid var(--sep)}
.row b{display:block;font-weight:500}
.row small{display:block;color:var(--mu);font-size:13px;word-break:break-all}
.row .t{flex:1;min-width:0}
.row svg{flex:none;color:var(--mu)}
.ic{flex:none;width:30px;height:30px;border-radius:7px;background:var(--bk);color:var(--bt);display:grid;place-items:center;font-size:13px;font-weight:700}
.st{padding:16px}
.st+.st{border-top:.5px solid var(--sep)}
.sh{display:flex;align-items:center;gap:12px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bk);color:var(--bt);display:grid;place-items:center;font-size:14px;font-weight:700}
.sh b{font-size:17px;font-weight:600}
.st p{margin:8px 0 0 40px;color:var(--mu);font-size:15px}
.shot{display:block;width:100%;max-width:260px;margin:14px auto 0;border-radius:12px;border:.5px solid var(--sep);background:#fff}
.btn{display:block;text-align:center;background:var(--ac);color:#fff;text-decoration:none;font-weight:600;border-radius:14px;padding:14px;margin-top:16px}
.foot{text-align:center;color:var(--mu);font-size:13px;margin-top:32px}
