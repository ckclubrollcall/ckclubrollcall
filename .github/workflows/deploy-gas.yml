name: Deploy
permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to GAS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ./gas

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./gas/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '%s' "$CLASP_JSON" > .clasp.json

      - name: Push and deploy to GAS
        env:
          DEPLOY_DESC_INPUT: ${{ github.event.head_commit.message }}
          PROD_ID: ${{ secrets.PROD_ID }}
        run: |
          DEPLOY_DESC=$(printf '%s' "$DEPLOY_DESC_INPUT" | tr '\n' ' ' | cut -c1-100)
          npx --no-install clasp push --force
          npx --no-install clasp deploy -i "$PROD_ID" -d "$DEPLOY_DESC"

      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.clasprc.json .clasp.json
