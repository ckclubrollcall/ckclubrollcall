name: Deploy
permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to GAS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ./gas

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./gas/package-lock.json
      - name: Setup clasp credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          echo '${{ secrets.CLASP_JSON }}' > .clasp.json

      - name: Push and deploy to GAS
        env:
          DEPLOY_DESC_INPUT: ${{ github.event.head_commit.message }}
        run: |
          DEPLOY_DESC=$(printf '%s' "$DEPLOY_DESC_INPUT" | tr '\n' ' ' | cut -c1-100)
          npx @google/clasp push --force
          npx @google/clasp deploy -i '${{ secrets.PROD_ID }}' -d "$DEPLOY_DESC"
