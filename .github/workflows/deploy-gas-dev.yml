name: Deploy
permissions:
  contents: read

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  deploy:
    name: Deploy to GAS and Render dev environment
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' &&
      github.event.label.name == 'needs testing') ||
      (github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'needs testing')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ./gas

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./gas/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup clasp credentials for dev environment
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON_DEV: ${{ secrets.CLASP_JSON_DEV }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '%s' "$CLASP_JSON_DEV" > .clasp.json

      - name: Push and deploy to GAS dev environment
        env:
          DEPLOY_DESC_INPUT: ${{ github.event.pull_request.title }}
          DEV_ID: ${{ secrets.DEV_ID }}
        run: |
          DEPLOY_DESC=$(printf '%s' "$DEPLOY_DESC_INPUT" | tr '\n' ' ' | cut -c1-100)
          npx --no-install clasp push --force
          npx --no-install clasp deploy -i "$DEV_ID" -d "$DEPLOY_DESC"

      - name: Deploy to Render dev environment
        env:
          RENDER_DEPLOY_HOOK_URL_DEV: ${{ secrets.RENDER_DEPLOY_HOOK_URL_DEV }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL_DEV" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL_DEV secret is not set. Skipping Render deployment."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 --retry 2 \
            --request POST "${RENDER_DEPLOY_HOOK_URL_DEV}&ref=${HEAD_SHA}" \
            > /dev/null || {
            echo "::error::Render deployment failed."
            exit 1
          }
