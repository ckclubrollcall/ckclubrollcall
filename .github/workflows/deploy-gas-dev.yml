name: Deploy
permissions:
  contents: read

on:
  pull_request:
    types: [labeled]

jobs:
  deploy:
    name: Deploy to GAS and Render dev environment
    if: (github.event.action == 'labeled' &&
      github.event.label.name == 'needs testing') ||
      (github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'needs testing'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: ./gas

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./gas/package-lock.json
      - name: Setup clasp credentials for dev environment
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          echo '${{ secrets.CLASP_JSON_DEV }}' > .clasp.json

      - name: Push and deploy to GAS dev environment
        env:
          DEPLOY_DESC_INPUT: ${{ github.event.head_commit.message }}
        run: |
          DEPLOY_DESC=$(printf '%s' "$DEPLOY_DESC_INPUT" | tr '\n' ' ' | cut -c1-100)
          npx @google/clasp push --force
          npx @google/clasp deploy -i '${{ secrets.DEV_ID }}' -d "$DEPLOY_DESC"

      - name: Push and deploy to Render dev environment
        env:
          RENDER_DEPLOY_HOOK_URL_DEV: ${{ secrets.RENDER_DEPLOY_HOOK_URL_DEV }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL_DEV" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL_DEV secret is not set. Skipping Render deployment."
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL_DEV" || {
            echo "::error::Render deployment failed."
            exit 1
          }
